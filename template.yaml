AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Breve backend: API Gateway, Lambda, YouTube Data API integration, and
  Amazon Bedrock Nova recommendation ranking. No database or frontend included.

Parameters:
  YouTubeApiKey:
    Type: String
    NoEcho: true
    Description: YouTube Data API v3 key. Do not commit this value to source control.

  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model ID available in the deployment region.

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Frontend origin allowed by CORS. Restrict this after deploying the website.

  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  BreveLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub breve-recommendation-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BreveLambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Sid: InvokeBedrockNova
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}

  BreveRecommendationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub breve-recommendation-handler-${AWS::StackName}
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BreveLambdaRole.Arn
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          YOUTUBE_API_KEY: !Ref YouTubeApiKey
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DURATION_PROFILE: >-
            {"quick":{"breakfast":[10,10],"lunch":[15,17],"dinner":[15,20],"relaxed":[45,60]},"slow":{"breakfast":[20,20],"lunch":[25,30],"dinner":[30,35],"relaxed":[45,60]}}
      Code:
        ZipFile: |
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import urllib.error

          import boto3

          bedrock = boto3.client("bedrock-runtime")

          MEALS = {"breakfast", "lunch", "dinner", "relaxed"}
          EATERS = {"quick", "slow"}
          CATEGORIES = {"movies", "comedy", "sports", "news"}
          LANGUAGES = {"english": "en", "hindi": "hi", "japanese": "ja"}

          def response(status, body):
              return {
                  "statusCode": status,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": os.environ.get("ALLOWED_ORIGIN", "*"),
                      "Access-Control-Allow-Headers": "content-type",
                      "Access-Control-Allow-Methods": "OPTIONS,POST",
                  },
                  "body": json.dumps(body),
              }

          def parse_duration(value):
              # YouTube durations are ISO 8601, for example PT12M34S or PT1H2M.
              match = re.fullmatch(
                  r"P(?:([0-9]+)D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?", value or ""
              )
              if not match:
                  return None
              days, hours, minutes, seconds = [int(x or 0) for x in match.groups()]
              return days * 1440 + hours * 60 + minutes + seconds / 60

          def duration_text(minutes):
              total_seconds = round(minutes * 60)
              hours, remainder = divmod(total_seconds, 3600)
              mins, secs = divmod(remainder, 60)
              if hours:
                  return f"{hours}:{mins:02d}:{secs:02d}"
              return f"{mins}:{secs:02d}"

          def youtube_get(path, params):
              query = urllib.parse.urlencode(params)
              url = "https://www.googleapis.com/youtube/v3/" + path + "?" + query
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=10) as result:
                  return json.loads(result.read().decode("utf-8"))

          def fetch_candidates(category, language, lower, upper):
              # YouTube's duration filter is coarse, so Lambda applies the exact filter below.
              coarse_duration = "long" if lower >= 20 else "medium"
              search = youtube_get("search", {
                  "key": os.environ["YOUTUBE_API_KEY"],
                  "part": "snippet",
                  "type": "video",
                  "q": f"{category} {language}",
                  "maxResults": "50",
                  "order": "relevance",
                  "videoDuration": coarse_duration,
                  "relevanceLanguage": LANGUAGES[language],
              })
              ids = [item["id"]["videoId"] for item in search.get("items", []) if item.get("id", {}).get("videoId")]
              if not ids:
                  return []

              details = youtube_get("videos", {
                  "key": os.environ["YOUTUBE_API_KEY"],
                  "part": "snippet,contentDetails,statistics",
                  "id": ",".join(ids),
              })
              candidates = []
              for item in details.get("items", []):
                  minutes = parse_duration(item.get("contentDetails", {}).get("duration"))
                  if minutes is None or minutes < lower or minutes > upper:
                      continue
                  snippet = item.get("snippet", {})
                  stats = item.get("statistics", {})
                  candidates.append({
                      "videoId": item["id"],
                      "title": snippet.get("title", ""),
                      "description": snippet.get("description", "")[:800],
                      "channel": snippet.get("channelTitle", ""),
                      "publishedAt": snippet.get("publishedAt", ""),
                      "durationMinutes": round(minutes, 2),
                      "duration": duration_text(minutes),
                      "viewCount": int(stats.get("viewCount", 0)),
                      "url": f"https://www.youtube.com/watch?v={item['id']}",
                      "thumbnail": snippet.get("thumbnails", {}).get("high", {}).get("url")
                          or snippet.get("thumbnails", {}).get("default", {}).get("url"),
                  })
              return candidates

          def rank_with_bedrock(candidates, meal, eater, category, language, lower, upper):
              if not candidates:
                  return []
              prompt = f"""
          You are the recommendation ranking component for Breve, an app that suggests one
          YouTube video to watch while eating. The user selected:
          - meal: {meal}
          - eater type: {eater}
          - category: {category}
          - language: {language}
          - acceptable duration: {lower:.0f} to {upper:.0f} minutes

          Rank the supplied candidates and return the best five. Prefer genuine relevance to
          the category and language, strong titles/descriptions, reasonable popularity, and
          variety between channels. Never invent a candidate, URL, video ID, title, duration,
          or channel. Return ONLY valid JSON in this format:
          {{"recommendations":[{{"videoId":"...","reason":"one short sentence"}}]}}

          Candidates:
          {json.dumps(candidates, ensure_ascii=False)}
          """
              body = {
                  "schemaVersion": "messages-v1",
                  "messages": [{"role": "user", "content": [{"text": prompt}]}],
                  "inferenceConfig": {"maxTokens": 1200, "temperature": 0.2},
              }
              result = bedrock.invoke_model(
                  modelId=os.environ["BEDROCK_MODEL_ID"],
                  contentType="application/json",
                  accept="application/json",
                  body=json.dumps(body),
              )
              payload = json.loads(result["body"].read())
              text = payload["output"]["message"]["content"][0]["text"]
              text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text.strip())
              ranked = json.loads(text).get("recommendations", [])
              by_id = {item["videoId"]: item for item in candidates}
              output = []
              for item in ranked:
                  candidate = by_id.get(item.get("videoId"))
                  if candidate:
                      output.append({**candidate, "reason": item.get("reason", "Relevant to your selection.")})
              return output[:5]

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return response(204, {})
              try:
                  raw_body = event.get("body") or "{}"
                  body = json.loads(raw_body) if isinstance(raw_body, str) else raw_body
                  meal = str(body.get("meal", "")).strip().lower()
                  eater = str(body.get("eaterType", "")).strip().lower()
                  category = str(body.get("category", "")).strip().lower()
                  language = str(body.get("language", "")).strip().lower()
                  if meal not in MEALS or eater not in EATERS or category not in CATEGORIES or language not in LANGUAGES:
                      return response(400, {"error": "Invalid meal, eaterType, category, or language."})

                  profile = json.loads(os.environ["DURATION_PROFILE"])
                  start, end = profile[eater][meal]
                  # A single target gets +/- 2 minutes. Existing ranges remain ranges with +/- 2.
                  lower = max(0, start - 2)
                  upper = end + 2
                  candidates = fetch_candidates(category, language, lower, upper)
                  recommendations = rank_with_bedrock(candidates, meal, eater, category, language, lower, upper)
                  return response(200, {
                      "request": {"meal": meal, "eaterType": eater, "category": category, "language": language},
                      "durationRangeMinutes": {"min": lower, "max": upper},
                      "recommendations": recommendations,
                      "candidateCount": len(candidates),
                  })
              except urllib.error.HTTPError as error:
                  return response(502, {"error": "YouTube API request failed.", "details": error.read().decode("utf-8")[:500]})
              except Exception as error:
                  print(f"Unhandled error: {error}")
                  return response(500, {"error": "Recommendation request failed."})

  BreveLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: BreveRecommendationFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/${BreveRecommendationFunction}
      RetentionInDays: !Ref LogRetentionInDays

  BreveApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub breve-api-${AWS::StackName}
      EndpointConfiguration:
        Types:
          - REGIONAL

  BreveApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BreveApi
      ParentId: !GetAtt BreveApi.RootResourceId
      PathPart: recommend

  BreveApiPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BreveApi
      ResourceId: !Ref BreveApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt BreveRecommendationFunction.Arn
      MethodResponses:
        - StatusCode: 200

  BreveApiOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BreveApi
      ResourceId: !Ref BreveApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 204}'
        IntegrationResponses:
          - StatusCode: 204
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'content-type'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodResponses:
        - StatusCode: 204
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  BreveApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - BreveApiPost
      - BreveApiOptions
    Properties:
      RestApiId: !Ref BreveApi
      StageName: prod

  BreveLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BreveRecommendationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BreveApi}/*/POST/recommend

Outputs:
  RecommendationEndpoint:
    Description: POST endpoint for Breve recommendations
    Value: !Sub https://${BreveApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/recommend

  LambdaFunctionName:
    Description: Breve recommendation Lambda function
    Value: !Ref BreveRecommendationFunction

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref BreveApi
